projects:
  - companyName: BetaQuest Theranostics
    projectName: Target Product Profile for a Betabody-Based Radiotheranostic
    description: Create an evidence-based, preliminary target product profile (TPP) for BetaQuest Theranostics' lead Betabody radiotheranostic program in colorectal cancer with peritoneal metastasis (CRC-PM).
  - companyName: Milo Lin Lab
    projectName: ""
    description: Discover the key learning principles that enable scalable neural evolution. Devise a scalable local autonomous network algorithm for evolution of neural network to learn general-purpose tasks.
  - companyName: MPM Medical
    projectName: Pressure Transmission Through MPM Collagen Matrices During Simulated NPWT
    description: MPM Medical currently lacks a standardized bench dataset describing how its collagen matrix behaves under NPWT conditions. The team will reproduce the core experimental approach reported by Veale et al. using an independently constructed benchtop system and MPM test articles.
  - companyName: Jibe Therapeutics
    projectName: uTCE T Cell Activation Screen
    description: Jibe has generated a panel of uTCE candidates designed to redirect T cells against solid tumors without relying on a single tumor-restricted target antigen. Before advancing any candidate further, Jibe needs to know which uTCE(s) activate T cells most effectively, and how consistently that activity holds up across  tumor types.